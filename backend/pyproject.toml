[project]
name = "issuepilot-backend"
version = "0.1.0"
description = "IssuePilot backend — FastAPI + Celery + SQLAlchemy"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.17",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.389",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "anyio>=4.6.0",
    "respx>=0.21.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E", "F", "I"]

[tool.pyright]
include = ["app", "tests"]
exclude = ["**/__pycache__", "alembic/versions"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
