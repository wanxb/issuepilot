# ============================================================================
# IssuePilot — 本地开发全栈
#
# 启动：docker compose up -d
# 仅基础设施：docker compose up -d postgres redis
# 日志：docker compose logs -f api worker frontend
# 停：docker compose down  （加 -v 同时清数据卷）
#
# 主机：Windows + Docker Desktop。源码通过 volume 挂载，命名 volume 隔离
# 容器内 node_modules / .venv，避免与主机产物互相覆盖。
# ============================================================================

name: issuepilot

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: issuepilot
      POSTGRES_PASSWORD: issuepilot
      POSTGRES_DB: issuepilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuepilot -d issuepilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://issuepilot:issuepilot@postgres:5432/issuepilot
      REDIS_URL: redis://redis:6379/0
      ENV: dev
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/opt/venv   # 隔离容器 venv，避免被主机覆盖
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://issuepilot:issuepilot@postgres:5432/issuepilot
      REDIS_URL: redis://redis:6379/0
      ENV: dev
    volumes:
      - ./backend:/app
      - backend_venv:/opt/venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --queues=analyze_queue,dev_queue,review_queue
      --concurrency=2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_INTERNAL_URL: http://api:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  backend_venv:
  frontend_node_modules:
  frontend_next_cache:
